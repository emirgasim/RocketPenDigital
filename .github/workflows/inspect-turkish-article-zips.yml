                              m = re.search(r'^#\\s+(.+)$', text, re.M)
                              title = m.group(1).strip() if m else ''
                          print('SAMPLE_FILE:', x.filename, '| title:', title[:240], '| chars:', len(text))
                          print('HEADINGS:', ' | '.join(re.findall(r'^#{1,3}\\s+(.+)
                          samples += 1
                          if samples >= 1:
                              break
              except Exception as e:
                  print('ZIP_ERROR:', zp.name, repr(e))
          PY
