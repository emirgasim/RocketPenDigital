name: Inspect Turkish Article Archives
on:
  push:
    branches: [main]
    paths:
      - "RocketPenDigital_1000_Makale_Parca_*.zip"
      - ".github/workflows/inspect-turkish-article-zips.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive contents without modifying the site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          zips = sorted(Path('.').glob('RocketPenDigital_1000_Makale_Parca_*.zip'))
          if not zips:
              raise SystemExit('No Turkish article archives found in repository root.')
          for zp in zips:
              print('\\n' + '='*88 + '\\nARCHIVE:', zp.name, 'SIZE:', zp.stat().st_size)
              with ZipFile(zp) as z:
                  files = [x for x in z.infolist() if not x.is_dir()]
                  print('ENTRY_COUNT:', len(files))
                  for x in files[:3]:
                      print('ENTRY:', x.filename, '| bytes:', x.file_size)
                  for x in files:
                      if Path(x.filename).suffix.lower() != '.md':
                          continue
                      text = z.read(x).decode('utf-8-sig', errors='replace')
                      print('SAMPLE_FILE:', x.filename, '| chars:', len(text))
                      print('HEADINGS:', [line for line in text.splitlines() if line.startswith('#')][:25])
                      print('SAMPLE_TEXT_FULL:', text[:5000].replace(chr(10), ' '))
                      break
