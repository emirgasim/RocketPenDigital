name: Refresh RocketPen Tech headlines

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/update-tech-news.yml"
      - "scripts/update-tech-news.mjs"

permissions:
  contents: write

concurrency:
  group: rocketpen-tech-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-headlines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Import recent Turkish technology headlines
        run: node scripts/update-tech-news.mjs
      - name: Commit changes when new headlines were found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data/news.json
          if git diff --cached --quiet; then
            echo "No headline changes."
          else
            git commit -m "Refresh recent technology headlines"
            git push
          fi
