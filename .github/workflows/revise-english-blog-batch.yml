name: Background English Blog Content Revision

on:
  schedule:
    # Review 15 English articles every six hours until the inventory is processed.
    - cron: "11 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Articles to review in this run (1–20)"
        required: false
        default: "15"
  push:
    branches: [main]
    paths:
      - ".github/workflows/revise-english-blog-batch.yml"
      - ".github/scripts/revise-english-blog-batch.mjs"

permissions:
  contents: write

concurrency:
  group: english-blog-content-revision
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Review and revise a batch of English articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '15' }}
        run: node .github/scripts/revise-english-blog-batch.mjs

      - name: Validate blog and SEO structure
        run: |
          node .github/scripts/seo-technical-audit.mjs
          node -e "const fs=require('fs'); const p='reports/english-content-revision-progress.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); console.log(JSON.stringify({total:m.totalArticleFiles,reviewed:Object.keys(m.reviewed||{}).length,completed:m.completed,lastBatch:m.lastBatch?.length||0},null,2))"

      - name: Commit reviewed batch and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/en/articles reports/english-content-revision-progress.json reports/english-content-review-latest.md reports/seo-technical-audit.md reports/seo-technical-audit.json
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Review and improve a batch of English blog articles"
            git push origin main
          fi

      - name: Publish batch summary
        if: always()
        run: |
          if [ -f reports/english-content-review-latest.md ]; then
            cat reports/english-content-review-latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
