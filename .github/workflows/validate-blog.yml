name: Validate Digital Blog

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/publish-digital-blog.mjs"
      - ".github/workflows/**"
      - "blog/**"
      - "index.html"
      - "languages/*.html"
  pull_request:
    paths:
      - ".github/scripts/publish-digital-blog.mjs"
      - ".github/workflows/**"
      - "blog/**"
      - "index.html"
      - "languages/*.html"
  workflow_dispatch:

jobs:
  syntax-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check publisher syntax
        run: node --check .github/scripts/publish-digital-blog.mjs
      - name: Check inline JavaScript for all language pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages = {
              "index.html": ("en", {"en": "index.html", "tr": "languages/tr.html", "ar": "languages/ar.html"}),
              "languages/tr.html": ("tr", {"en": "../index.html", "tr": "tr.html", "ar": "ar.html"}),
              "languages/ar.html": ("ar", {"en": "../index.html", "tr": "tr.html", "ar": "ar.html"}),
          }
          for filename, (locale, routes) in pages.items():
              text = Path(filename).read_text(encoding="utf-8")
              match = re.search(r"<script>([\s\S]*?)</script>", text)
              if not match:
                  raise SystemExit(f"{filename}: inline application script missing")
              Path(f"/tmp/rocketpen-{locale}.js").write_text(match.group(1), encoding="utf-8")
              expected = f"const pageLang='{locale}'"
              if expected not in text:
                  raise SystemExit(f"{filename}: wrong page language constant")
              expected_hero = {"en": "HELLO", "tr": "MERHABA", "ar": "مرحباً"}[locale]
              hero = re.search(r'<[^>]+data-i="heroLine1"[^>]*>(.*?)</[^>]+>', text, re.S)
              if not hero or hero.group(1).strip() != expected_hero:
                  raise SystemExit(f"{filename}: first headline is not statically rendered in {locale}")
              if "html:not(.js-ready) .reveal" not in text or "document.documentElement.classList.add('js-ready')" not in text:
                  raise SystemExit(f"{filename}: text visibility must have a JavaScript-failure fallback")
              if "<meta name=\"description\" content=\"" not in text:
                  raise SystemExit(f"{filename}: description meta tag missing")
              expected_titles = {
                  "en": "RocketPen — Build. Launch. Grow.",
                  "tr": "RocketPen — İnşa Et. Başlat. Büyüt.",
                  "ar": "روكيت بن — ابنِ. أطلق. انمُ."
              }
              if "<title>" + expected_titles[locale] + "</title>" not in text:
                  raise SystemExit(f"{filename}: page title is not localized")
              for code, href in routes.items():
                  if f'href="{href}" class="language-option" role="menuitem" data-lang="{code}"' not in text:
                      raise SystemExit(f"{filename}: {code} link must target {href}")
              expected_button_code = {"en": "EN", "tr": "TR", "ar": "AR"}[locale]
              if 'id="mobileNavToggle"' in text or 'class="mobile-nav-toggle"' in text:
                  raise SystemExit(f"{filename}: hamburger navigation must not be included")
              if 'id="primaryNavigation"' in text or '<nav class="nav-links"' in text:
                  raise SystemExit(f"{filename}: top navigation links must be removed from the homepage")
              if "mobileNavToggle" in text or "closeMobileNav" in text or "mobile-nav-toggle" in text:
                  raise SystemExit(f"{filename}: unused hamburger navigation script remains")
              if '<div class="hero-bottom-copy">' not in text or '<div class="hero-bottom">' in text:
                  raise SystemExit(f"{filename}: mobile hero copy must replace the old scroll prompt")
              if f'class="lang-code">{expected_button_code}</span>' not in text:
                  raise SystemExit(f"{filename}: static language button code is wrong")
              expected_picker_label = {"en": "Choose language", "tr": "Dil seçimi", "ar": "اختيار اللغة"}[locale]
              if text.count(f'aria-label="{expected_picker_label}"') < 2:
                  raise SystemExit(f"{filename}: language controls need localized accessible labels")
              if text.count('<a href="#blog" data-i="navBlog">') != 0:
                  raise SystemExit(f"{filename}: a top navigation link should not remain")
              if "if(event.key==='Escape'&&languagePicker.classList.contains('is-open'))" not in text:
                  raise SystemExit(f"{filename}: Escape must close the menu and restore focus")
              if "const video=document.querySelector('.hero-video');\nif(video){" not in text:
                  raise SystemExit(f"{filename}: video event handlers must tolerate a missing video element")
              if "blogCta:" not in text or "eyebrow:" not in text:
                  raise SystemExit(f"{filename}: malformed blog CTA translation object")
              js = match.group(1)
              start = js.find("\n" + locale + ":{")
              if start < 0:
                  raise SystemExit(f"{filename}: locale translation block missing")
              next_locale = {"en": "tr", "tr": "ar"}.get(locale)
              end = js.find("\n" + next_locale + ":{", start) if next_locale else js.find("\n};", start)
              block = js[start:end if end >= 0 else len(js)]
              keys = set(re.findall(r'data-i="([^"]+)"', text))
              missing = [key for key in keys if not re.search(r'(?<![\w$])' + re.escape(key) + r'\s*:', block)]
              if missing:
                  raise SystemExit(f"{filename}: locale {locale} has missing translations: {missing}")
          print("Language routes, translations and inline scripts extracted.")
          PY
          node --check /tmp/rocketpen-en.js
          node --check /tmp/rocketpen-tr.js
          node --check /tmp/rocketpen-ar.js
      - name: Audit HTML links, assets and duplicate IDs
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import os

          ROOT = Path.cwd().resolve()
          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.append(attrs["id"])
                  for name in ("href", "src"):
                      value = attrs.get(name)
                      if value:
                          self.refs.append((name, value))

          html_files = sorted(ROOT.rglob("*.html"))
          parsed = {}
          problems = []
          for file in html_files:
              checker = Checker()
              checker.feed(file.read_text(encoding="utf-8"))
              checker.close()
              parsed[file] = checker
              duplicates = sorted({x for x in checker.ids if checker.ids.count(x) > 1})
              if duplicates:
                  problems.append(f"{file.relative_to(ROOT)}: duplicate IDs {duplicates}")

          for file, checker in parsed.items():
              for kind, value in checker.refs:
                  value = value.strip()
                  if not value or value.startswith(("data:", "javascript:", "mailto:", "tel:", "blob:")):
                      continue
                  url = urlsplit(value)
                  if url.scheme or url.netloc:
                      continue
                  if kind == "href" and not url.path:
                      target = file
                  elif url.path.startswith("/"):
                      target = ROOT / unquote(url.path.lstrip("/"))
                  else:
                      target = file.parent / unquote(url.path)
                  target = Path(os.path.normpath(str(target)))
                  if target.is_dir():
                      target = target / "index.html"
                  if not target.exists():
                      problems.append(f"{file.relative_to(ROOT)}: missing {kind} target {value} -> {target}")
                      continue
                  if url.fragment and target in parsed:
                      fragment = unquote(url.fragment)
                      if fragment not in parsed[target].ids:
                          problems.append(f"{file.relative_to(ROOT)}: missing fragment {value} -> {target}")
          if problems:
              print("\n".join(problems))
              raise SystemExit(f"HTML audit failed with {len(problems)} issue(s)")
          print(f"HTML audit passed: {len(html_files)} pages, all local references and IDs checked.")
          PY
      - name: Check published article JSON
        run: |
          node -e "for (const f of ['blog/data/en/high-converting-website-guide.json','blog/data/tr/donusum-odakli-web-sitesi-rehberi.json','blog/data/ar/website-guide-uae-qatar.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Article JSON valid')"
      - name: Verify the localized blog structure
        shell: bash
        run: |
          test -f blog/en/index.html
          test -f blog/tr/index.html
          test -f blog/ar/index.html
          test -f blog/data/en/high-converting-website-guide.json
          test -f blog/data/tr/donusum-odakli-web-sitesi-rehberi.json
          test -f blog/data/ar/website-guide-uae-qatar.json
          grep -q '<!-- POSTS_START -->' blog/en/index.html
          grep -q '<!-- POSTS_END -->' blog/en/index.html
          grep -q '<!-- POSTS_START -->' blog/tr/index.html
          grep -q '<!-- POSTS_END -->' blog/tr/index.html
          grep -q '<!-- POSTS_START -->' blog/ar/index.html
          grep -q '<!-- POSTS_END -->' blog/ar/index.html
      - name: Verify crawler rules and publisher readiness safeguards
        shell: bash
        run: |
          ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f, aliases: true); puts "#{f}: YAML parsed" }' .github/workflows/*.yml
          test -f robots.txt
          grep -qx 'User-agent: \*' robots.txt
          grep -qx 'Allow: /' robots.txt
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/daily-digital-blog.yml").read_text(encoding="utf-8")
          publisher = Path(".github/scripts/publish-digital-blog.mjs").read_text(encoding="utf-8")

          main = publisher.split("async function main(){", 1)[1]
          if "if(SITE_URL){" not in main or main.find("if(SITE_URL){") > main.find("const byLang={}"):
              raise SystemExit("SITE_URL must be validated before any article generation/API requests")
          if "const seenSourceUrls = new Set();" not in publisher:
              raise SystemExit("Source URLs must be unique")
          if "u.protocol!=='https:'||!u.hostname||u.username||u.password" not in publisher:
              raise SystemExit("Each source must be a valid credential-free HTTPS URL")
          print("Publisher validates its origin before generation and rejects malformed or duplicate source URLs.")
          for filename in ("index.html", "languages/tr.html", "languages/ar.html"):
              html = Path(filename).read_text(encoding="utf-8")
              video = html.split('<video class="hero-video"', 1)[1].split(">", 1)[0]
              if "autoplay" in video.split():
                  raise SystemExit(f"{filename}: autoplay attribute bypasses reduced-motion preference")
              if 'preload="metadata"' not in video:
                  raise SystemExit(f"{filename}: hero video should not use eager preload")
              if "@media(prefers-reduced-motion:reduce){.hero-video{display:none!important}}" not in html:
                  raise SystemExit(f"{filename}: hero video must be hidden for reduced-motion users")
              js = html.split("const video=document.querySelector('.hero-video');", 1)[1]
              js = js.split("document.documentElement.classList.add('js-ready')", 1)[0]
              if "motionPreference.matches||document.hidden" not in js or "video.pause()" not in js:
                  raise SystemExit(f"{filename}: video playback must respect reduced-motion and background state")
          print("Hero autoplay is gated by reduced-motion preference and non-eager video loading.")
          icon = Path("asset/logo/favicon.svg")
          if not icon.exists() or "<svg" not in icon.read_text(encoding="utf-8"):
              raise SystemExit("Branded SVG favicon is missing or invalid")
          for path in Path(".").rglob("*.html"):
              if 'rel="icon" type="image/svg+xml" href="/asset/logo/favicon.svg"' not in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"{path}: branded favicon link missing")
          if '<link rel="icon" type="image/svg+xml" href="/asset/logo/favicon.svg">' not in publisher:
              raise SystemExit("Generated articles must include branded favicon")
          if '<body class="arabic">' not in Path("languages/ar.html").read_text(encoding="utf-8"):
              raise SystemExit("Arabic body styling must work before JavaScript initializes")
          print("Branded favicon, generated article icon link, and static Arabic styling verified.")
          ar_html = Path("languages/ar.html").read_text(encoding="utf-8")
          if ".arabic .language-menu{left:0;right:auto}" not in ar_html:
              raise SystemExit("RTL language menu must align inward from the left edge")
          print("RTL language dropdown alignment is present.")
          if "SITE_URL: ${{ vars.SITE_URL }}" not in workflow:
              raise SystemExit("Daily workflow must read SITE_URL from repository variables")
          if 'echo "::error::Publishing cannot run' not in workflow or 'exit 1' not in workflow:
              raise SystemExit("Missing API key must fail the workflow instead of reporting a green skip")
          if "robots.txt was written" not in publisher:
              raise SystemExit("Publisher must create robots.txt even if SITE_URL is missing")
          if "parsedSite.protocol!=='https:'||parsedSite.origin!==SITE_URL" not in publisher:
              raise SystemExit("SITE_URL must be validated as a canonical HTTPS origin")
          print("Crawler rules, explicit API-key failure and canonical-origin guard verified.")
          PY
