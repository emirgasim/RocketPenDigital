name: Import 300 Arabic long articles
on:
  push:
    paths:
      - 'RocketPenDigital_300_LongArticles_Complete.zip'
      - 'imports/RocketPenDigital_300_LongArticles_Complete.zip'
      - '.github/workflows/import-arabic-300.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-arabic-long-articles
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Locate uploaded archive
        run: |
          mkdir -p imports
          if [ -f RocketPenDigital_300_LongArticles_Complete.zip ]; then
            cp RocketPenDigital_300_LongArticles_Complete.zip imports/RocketPenDigital_300_LongArticles_Complete.zip
          fi
          test -f imports/RocketPenDigital_300_LongArticles_Complete.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate importer syntax
        run: node --check scripts/import-arabic-300.mjs
      - name: Import articles, pagination and sitemap
        run: |
          node scripts/import-arabic-300.mjs
          rm -f imports/RocketPenDigital_300_LongArticles_Complete.zip
          rm -f RocketPenDigital_300_LongArticles_Complete.zip
      - name: Commit generated Arabic blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import 300 long Arabic blog articles"
            git push origin main
          fi
