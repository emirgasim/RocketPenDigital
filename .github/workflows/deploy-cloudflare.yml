name: Deploy RocketPen Digital to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "index.html"
      - "languages/**"
      - "assets/**"
      - "asset/**"
      - "news/**"
      - "RocketPenTech_500_*.zip"
      - "scripts/build_news_archive.py"
      - "sitemap.xml"
      - "robots.txt"
      - "_redirects"
      - "wrangler.toml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Revise First 200 English Articles", "Generate Arabic Gulf SEO Articles"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build multilingual news archive from supplied ZIPs
        run: python scripts/build_news_archive.py
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Deployment blocked: add CLOUDFLARE_API_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Deployment blocked: add CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy static assets and Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
