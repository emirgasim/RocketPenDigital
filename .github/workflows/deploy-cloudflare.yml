name: Deploy RocketPen Digital to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "index.html"
      - "languages/**"
      - "assets/**"
      - "asset/**"
      - "news/**"
      - "RocketPenTech_500_*.zip"
      - "scripts/build_news_archive.py"
      - "sitemap.xml"
      - "robots.txt"
      - "_redirects"
      - "wrangler.toml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Revise First 200 English Articles", "Generate Arabic Gulf SEO Articles"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build multilingual news archive from supplied ZIPs
        run: python scripts/build_news_archive.py
      - name: QA archive data and unique story artwork
        run: python scripts/qa_news_archive.py
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Deployment blocked: add CLOUDFLARE_API_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Deployment blocked: add CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy static assets and Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Smoke-test deployed news endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://rocketpendigital.qasimm2012.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/news/data/news.json" -o /tmp/news.json
          python - <<'PY'
          import json
          from collections import Counter
          with open("/tmp/news.json", encoding="utf-8") as f:
              data = json.load(f)
          stories = data.get("stories", [])
          if not stories:
              raise SystemExit("Smoke test failed: live news.json has no stories.")
          published = Counter(s.get("lang") for s in stories if s.get("status") == "published")
          print(f"Live JSON response: {len(stories)} total stories; published by language: {dict(published)}")
          for lang in ("tr", "en", "ar"):
              if published[lang] < 10:
                  raise SystemExit(f"Smoke test failed: {lang} has only {published[lang]} published stories.")
          PY
          for LANG in tr en ar; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/news/$LANG/" -o "/tmp/news-$LANG.html"
            grep -q 'news.js?v=20261022-5' "/tmp/news-$LANG.html" || { echo "Smoke test failed: $LANG page did not serve the current JavaScript version."; exit 1; }
            grep -q 'id="home-slider-track"' "/tmp/news-$LANG.html" || { echo "Smoke test failed: $LANG page has no headline slider."; exit 1; }
            grep -q 'id="news-list"' "/tmp/news-$LANG.html" || { echo "Smoke test failed: $LANG page has no archive list."; exit 1; }
          done
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/news/assets/news.js?v=20261022-5" -o /tmp/news.js
          node --check /tmp/news.js
          echo "Smoke test passed: live JSON, all three editions, slider, archive list, and JS syntax."
