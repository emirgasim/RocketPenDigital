name: Browser QA

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "languages/*.html"
      - "blog/**"
      - "asset/logo/favicon.svg"
      - "asset/css/responsive-overrides.css"
      - ".github/scripts/browser-qa.cjs"
      - ".github/workflows/browser-qa.yml"
  pull_request:
    paths:
      - "index.html"
      - "languages/*.html"
      - "blog/**"
      - "asset/logo/favicon.svg"
      - ".github/scripts/browser-qa.cjs"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright Chromium
        run: |
          npm install --prefix /tmp/rocketpen-playwright --no-save --no-package-lock playwright
          /tmp/rocketpen-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start local site and run browser checks
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/rocketpen-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          NODE_PATH=/tmp/rocketpen-playwright/node_modules node .github/scripts/browser-qa.cjs
