name: Revise First 200 English Articles
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    if: github.event.head_commit.message != 'Revise 200 English SEO articles in batch 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rewrite the first 200 eligible English articles without an LLM API
        run: node .github/scripts/revise-first-200-articles.mjs
      - name: Commit the revised batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/en/articles reports/part-1-batch-200-revised.txt
          git diff --cached --quiet && exit 0
          git commit -m "Revise 200 English SEO articles in batch 1"
          git pull --rebase origin main
          git push origin main
