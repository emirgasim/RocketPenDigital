name: Daily Digital Blog Publishing

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/publish-digital-blog.mjs"
      - ".github/workflows/daily-digital-blog.yml"
  schedule:
    # 05:17 UTC = 08:17 Türkiye time; runs continue daily until each language reaches 100 articles.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digital-blog
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check target progress and publishing configuration
        id: readiness
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://rocketpendigital.com' }}
        run: |
          TARGET=100
          en=$(find blog/data/en -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          tr=$(find blog/data/tr -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          ar=$(find blog/data/ar -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          printf 'Current article count — EN: %s/%s; TR: %s/%s; AR: %s/%s\n' "$en" "$TARGET" "$tr" "$TARGET" "$ar" "$TARGET"
          printf '%s\n' '## Digital Blog target progress' '' "- English: **$en/$TARGET**" "- Turkish: **$tr/$TARGET**" "- Arabic: **$ar/$TARGET**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$en" -ge "$TARGET" ] && [ "$tr" -ge "$TARGET" ] && [ "$ar" -ge "$TARGET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' '' 'All three language targets have been reached. No new articles are needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "complete=false" >> "$GITHUB_OUTPUT"
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Publishing cannot run: article target is not complete and OPENAI_API_KEY is missing. Add it under Settings > Secrets and variables > Actions > Secrets, then re-run this workflow."
            printf '%s\n' '' '## Publishing blocked' '' 'The workflow is configured to continue until each language has 100 article JSON records, but OPENAI_API_KEY is missing. No new researched articles were generated in this run.' 'Add the secret and re-run this workflow.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          if [ -z "$SITE_URL" ]; then
            echo "::warning::SITE_URL is not configured. The workflow fallback will use the current workers.dev origin."
          fi
          printf '%s\n' '' 'The article API key is present. The workflow will research, quality-check and publish the next batch.' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Research, quality-check and publish up to 30 articles
        if: steps.readiness.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://rocketpendigital.com' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: node .github/scripts/publish-digital-blog.mjs

      - name: Commit and publish generated pages
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog index.html languages
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if [ -f robots.txt ]; then git add robots.txt; fi
          if git diff --cached --quiet; then
            echo "No generated content changes to commit."
            printf '%s\n' '' 'No new content changes were produced. Review the generation logs before treating this as a publication day.' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Publish researched multilingual Digital Blog batch"
            git push
            printf '%s\n' '' '## Publication status' '' 'The generated article pages, index pages and sitemap were committed and pushed successfully.' '' '[Open English Digital Blog](https://rocketpendigital.com/blog/en/index.html) · [Türkçe](https://rocketpendigital.com/blog/tr/index.html) · [العربية](https://rocketpendigital.com/blog/ar/index.html)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy the generated multilingual blog directly to Cloudflare
        if: steps.readiness.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Articles were generated, but deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Verify published pages, archives and multilingual sitemap
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for HOST in "https://rocketpendigital.qasimm2012.workers.dev" "https://rocketpendigital.com"; do
            for URL in "/blog/en/index.html" "/blog/tr/index.html" "/blog/ar/index.html" "/blog/tr/page/30.html" "/blog/en/page/28.html" "/blog/ar/page/31.html" "/sitemap.xml"; do
              code="$(curl --silent --show-error --location --retry 5 --retry-delay 2 -o /tmp/rocketpen-live -w '%{http_code}' "$HOST$URL")"
              echo "$HOST$URL => $code"
              if [ "$code" != "200" ]; then
                echo "::error::Published endpoint failed: $HOST$URL ($code)"
                head -c 300 /tmp/rocketpen-live || true
                exit 1
              fi
              if [ "$URL" = "/sitemap.xml" ]; then cp /tmp/rocketpen-live /tmp/rocketpen-sitemap.xml; fi
            done
          done
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/rocketpen-sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text or '' for x in root.findall('.//s:loc',ns)]
          for lang,minimum in [('en',650),('tr',440),('ar',450)]:
              count=sum('/blog/'+lang+'/articles/' in u for u in urls)
              print(f'{lang}: {count} article URLs in sitemap')
              if count < minimum:
                  raise SystemExit(f'Sitemap has fewer than the pre-existing {minimum} {lang} articles')
          if len(urls)!=len(set(urls)):
              raise SystemExit('Duplicate sitemap URLs found')
          print(f'Sitemap verified: {len(urls)} unique URLs across EN/TR/AR.')
          PY
          printf '%s\\n' '' '## Live deployment verification' '' 'The generated multilingual articles were deployed directly to Cloudflare and the English, Turkish and Arabic blog indexes, archive pages and sitemap returned HTTP 200 on both production hosts.' >> "$GITHUB_STEP_SUMMARY"
