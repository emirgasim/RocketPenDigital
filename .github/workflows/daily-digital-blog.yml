name: Daily Digital Blog Publishing

on:
  schedule:
    # 05:17 UTC = 08:17 Türkiye time; GitHub scheduled runs may start a little later.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digital-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check publishing configuration
        id: readiness
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing was skipped: add OPENAI_API_KEY under Settings > Secrets and variables > Actions."
            printf '%s\n' '## Digital Blog publishing skipped' '' 'No articles were generated because the OPENAI_API_KEY repository secret is missing.' 'Add the key under Settings → Secrets and variables → Actions, then run this workflow manually to test it.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' '## Digital Blog publishing configuration' '' 'The API key is present. The workflow will research, validate and publish the scheduled batch.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Research, quality-check and publish ten articles
        if: steps.readiness.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: node .github/scripts/publish-digital-blog.mjs

      - name: Commit and publish generated pages
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog index.html languages
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if [ -f robots.txt ]; then git add robots.txt; fi
          if git diff --cached --quiet; then
            echo "No generated content changes to commit."
          else
            git commit -m "Publish daily multilingual Digital Blog articles"
            git push
          fi
