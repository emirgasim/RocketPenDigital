name: Integrate Turkish SEO articles 101-140
on:
  push:
    paths:
      - 'data/rocketpen-tr-101-140/part05.b64'
permissions:
  contents: write
jobs:
  import-and-deploy:
    if: hashFiles('data/rocketpen-tr-101-140/part05.b64') != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode the article package
        shell: bash
        run: |
          set -euo pipefail
          cat data/rocketpen-tr-101-140/part*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/rocketpen-tr-101-140.json.gz
          gzip --decompress --stdout /tmp/rocketpen-tr-101-140.json.gz > /tmp/rocketpen-tr-101-140.json
          node -e "const x=require('/tmp/rocketpen-tr-101-140.json'); if(!Array.isArray(x.articles)||x.articles.length!==40) throw new Error('Expected 40 articles'); console.log('Validated article package:',x.articles.length)"
      - name: Import full article pages, append archive pages and refresh sitemap
        run: node scripts/import-seo-articles-batch.mjs /tmp/rocketpen-tr-101-140.json
      - name: Commit integrated Turkish blog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit; stopping to avoid an empty deploy."
            exit 1
          fi
          git commit -m "Publish Turkish SEO articles 101-140 and extend blog archive"
          git push origin main
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Deployment blocked: add CLOUDFLARE_API_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Deployment blocked: add CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Smoke-test the published Turkish archive
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://rocketpendigital.com"
          for path in \
            /blog/tr/articles/kurumsal-web-sitesi-yenileme-rehberi.html \
            /blog/tr/articles/web-sitesi-guvenligi-seo-rehberi.html \
            /blog/tr/page/28.html \
            /blog/tr/page/29.html \
            /blog/tr/page/30.html \
            /sitemap.xml; do
            echo "Checking $path"
            curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE$path" -o /tmp/rocketpen-smoke.html
          done
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          url='https://rocketpendigital.com/sitemap.xml'
          with urllib.request.urlopen(url, timeout=20) as r:
              root=ET.fromstring(r.read())
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[e.text or '' for e in root.findall('.//s:loc',ns)]
          tr_articles=[u for u in locs if '/blog/tr/articles/' in u]
          tr_pages=[u for u in locs if '/blog/tr/page/' in u]
          assert len(tr_articles)==440, f'Expected 440 Turkish article URLs, found {len(tr_articles)}'
          assert all(f'/blog/tr/page/{n}.html' in locs for n in (28,29,30)), 'Archive pagination URLs missing from sitemap'
          assert len(locs)==len(set(locs)), 'Duplicate sitemap URLs'
          print(f'Live sitemap verified: {len(tr_articles)} Turkish articles; {len(tr_pages)} numbered Turkish archive pages.')
          PY
