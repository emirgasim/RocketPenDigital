name: SEO Canonical Maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-maintenance.yml"
      - ".github/scripts/seo-maintenance.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-canonical-maintenance
  cancel-in-progress: false

jobs:
  canonical-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fix canonical URLs, sitemap and robots.txt
        run: node .github/scripts/seo-maintenance.mjs
      - name: Commit SEO fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No SEO changes were needed."
          else
            git commit -m "Fix canonical URLs across multilingual blog"
            git push
          fi
