name: Normalize Arabic article pages
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-arabic-articles.mjs'
      - '.github/workflows/fix-arabic-articles.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize all Arabic article pages
        run: node scripts/fix-arabic-articles.mjs
      - name: Commit normalized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ar/articles
          if ! git diff --cached --quiet; then
            git commit -m "Normalize Arabic article headers, FAQs, related topics and CTAs"
            git push origin main
          else
            echo "No article changes required."
          fi
